[package]
name = "pvwatts_tool"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
# default-tls = native-tls -> SChannel on Windows (built-in, no OpenSSL/NASM/cmake),
# Secure Transport on macOS. Simplest, most reliable Windows build; no C TLS dep.
reqwest = { version = "0.12", features = ["json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
axum = "0.7"
printpdf = "0.7"
open = "5"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
