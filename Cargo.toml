[package]
name = "pvwatts_tool"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
# rustls-tls (not native-tls/OpenSSL) so the Windows cross-compile has no C TLS dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
axum = "0.7"
printpdf = "0.7"
open = "5"
chrono = { version = "0.4", features = ["clock"] }
