# Mac build of the PVWatts tool, kept separate from the Windows release.
#
# Runs only when a tag starting with `mac-v` is pushed (e.g. `mac-v2.1.2`), so
# ordinary pushes to herb/main never spend macOS runner minutes and never
# touch the Windows exe. Produces one universal binary (Apple chip + Intel) in
# pvwatts_tool_mac_<tag>.zip under the run's Artifacts.
#
# No sidecar key is baked in: N8N_TOOLS_API_KEY is deliberately not set here.
name: build-macos

on:
  push:
    tags: ["mac-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --release

      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Make universal binary and zip
        run: |
          mkdir -p dist
          lipo -create -output dist/pvwatts_tool \
            target/aarch64-apple-darwin/release/pvwatts_tool \
            target/x86_64-apple-darwin/release/pvwatts_tool
          codesign --force --sign - dist/pvwatts_tool
          chmod +x dist/pvwatts_tool
          cd dist && zip -X "pvwatts_tool_mac_${GITHUB_REF_NAME}.zip" pvwatts_tool

      - uses: actions/upload-artifact@v4
        with:
          name: pvwatts_tool_mac_${{ github.ref_name }}
          path: dist/pvwatts_tool_mac_*.zip
