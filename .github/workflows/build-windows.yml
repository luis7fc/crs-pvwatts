name: build-windows

# Builds the Windows .exe natively on a Windows runner (the reliable hand-off
# path — no cross-toolchain needed). Download it from the run's Artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: pvwatts_tool-windows
          path: target/release/pvwatts_tool.exe
